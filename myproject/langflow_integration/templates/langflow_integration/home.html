<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langflow AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366F1;
            --primary-light: #818CF8;
            --primary-dark: #4F46E5;
            --secondary-color: #F3F4F6;
            --text-color: #1F2937;
            --text-light: #6B7280;
            --bg-color: #F9FAFB;
            --chat-bg: #FFFFFF;
            --user-message-bg: #6366F1;
            --user-message-color: #FFFFFF;
            --bot-message-bg: #F3F4F6;
            --bot-message-color: #1F2937;
            --error-color: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --rounded-full: 9999px;
            --rounded-lg: 0.5rem;
            --rounded-xl: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon {
            background-color: var(--primary-color);
            color: white;
            height: 3rem;
            width: 3rem;
            border-radius: var(--rounded-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 0.75rem;
            box-shadow: var(--shadow);
        }

        .logo-text h1 {
            color: var(--text-color);
            font-size: 1.875rem;
            font-weight: 700;
            line-height: 1.25;
            margin: 0;
        }

        .header p {
            color: var(--text-light);
            font-size: 1rem;
            max-width: 32rem;
            margin-top: 0.5rem;
        }

        #errorMessage {
            color: var(--error-color);
            background-color: rgba(239, 68, 68, 0.1);
            padding: 0.75rem 1rem;
            border-radius: var(--rounded-lg);
            margin-bottom: 1rem;
            display: none;
            text-align: center;
            font-weight: 500;
            border-left: 4px solid var(--error-color);
        }

        .chat-container {
            background-color: var(--chat-bg);
            border-radius: var(--rounded-xl);
            box-shadow: var(--shadow-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--secondary-color);
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        .assistant-info {
            display: flex;
            align-items: center;
        }

        .assistant-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--rounded-full);
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-right: 0.75rem;
            font-size: 1.25rem;
        }

        .assistant-status {
            display: flex;
            flex-direction: column;
        }

        .assistant-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .assistant-availability {
            font-size: 0.75rem;
            color: #10B981;
            display: flex;
            align-items: center;
        }

        .assistant-availability::before {
            content: '';
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            background-color: #10B981;
            border-radius: 50%;
            margin-right: 0.25rem;
        }

        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .message-container {
            display: flex;
            margin-bottom: 1.25rem;
            transition: all 0.3s ease;
        }

        .message-avatar {
            width: 2rem;
            height: 2rem;
            border-radius: var(--rounded-full);
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.875rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .user-avatar {
            background-color: #4B5563;
        }

        .message-content {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message-bubble {
            padding: 0.8rem 1.25rem;
            border-radius: var(--rounded-lg);
            position: relative;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            justify-content: flex-end;
            /* Align user messages to the right */
        }

        .user-message .message-avatar {
            order: 2;
            /* Move avatar to the right */
            margin-left: 0.75rem;
            /* Add spacing between message and avatar */
            margin-right: 0;
            /* Remove right margin */
        }

        .user-message .message-content {
            order: 1;
            /* Move message content to the left */
            margin-left: auto;
            /* Push message content to the right */
            margin-right: 0;
            /* Remove right margin */
        }

        .user-message .message-bubble {
            background-color: var(--user-message-bg);
            color: var(--user-message-color);
            border-top-left-radius: var(--rounded-lg);
            /* Adjust bubble shape */
            border-top-right-radius: 0;
            /* Remove right-radius for user messages */
            margin-left: auto;
            /* Align bubble to the right */
        }

        .user-message .message-time {
            margin-left: auto;
            /* Align timestamp to the right */
        }

        .bot-message .message-bubble {
            background-color: var(--bot-message-bg);
            color: var(--bot-message-color);
            border-top-left-radius: 0.125rem;
        }

        .message-time {
            font-size: 0.6875rem;
            color: var(--text-light);
            margin-top: 0.375rem;
            opacity: 0.8;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            padding: 0.8rem 1.25rem;
            border-radius: var(--rounded-lg);
            background-color: var(--bot-message-bg);
            box-shadow: var(--shadow-sm);
            max-width: fit-content;
            margin-bottom: 1.25rem;
            border-top-left-radius: 0.125rem;
        }

        .typing-indicator span {
            height: 0.5rem;
            width: 0.5rem;
            border-radius: 50%;
            background-color: var(--text-light);
            display: inline-block;
            margin-right: 0.25rem;
            opacity: 0.6;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
            margin-right: 0;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-0.5rem);
            }
        }

        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--secondary-color);
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            position: relative;
        }

        .input-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            background-color: var(--secondary-color);
            border-radius: var(--rounded-full);
            transition: all 0.3s ease;
            padding: 0 0.5rem;
        }

        .input-container:focus-within {
            box-shadow: 0 0 0 2px var(--primary-light);
            background-color: white;
        }

        #userInput {
            flex: 1;
            padding: 0.875rem 1rem;
            border: none;
            background: transparent;
            font-size: 0.9375rem;
            outline: none;
            color: var(--text-color);
            font-family: inherit;
        }

        #userInput::placeholder {
            color: var(--text-light);
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--rounded-full);
            outline: none;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-button {
            color: var(--text-light);
            width: 2.5rem;
            height: 2.5rem;
        }

        .input-button:hover {
            color: var(--primary-color);
            background-color: rgba(99, 102, 241, 0.1);
        }

        #sendButton {
            background-color: var(--primary-color);
            color: white;
            width: 2.5rem;
            height: 2.5rem;
            margin-left: 0.5rem;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
        }

        #sendButton:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        #sendButton:active:not(:disabled) {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 1.5rem 0;
            color: var(--text-light);
            font-size: 0.8125rem;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            .header {
                padding: 1rem 0;
            }

            .logo-icon {
                height: 2.5rem;
                width: 2.5rem;
                font-size: 1.25rem;
            }

            .logo-text h1 {
                font-size: 1.5rem;
            }

            .chat-header,
            .input-area {
                padding: 0.75rem 1rem;
            }

            #chatbox {
                padding: 1rem;
            }

            .message-bubble {
                padding: 0.75rem 1rem;
            }
        }

        /* Dark mode support with color-scheme */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #818CF8;
                --primary-light: #A5B4FC;
                --primary-dark: #6366F1;
                --secondary-color: #374151;
                --text-color: #F9FAFB;
                --text-light: #9CA3AF;
                --bg-color: #111827;
                --chat-bg: #1F2937;
                --user-message-bg: #6366F1;
                --user-message-color: #FFFFFF;
                --bot-message-bg: #374151;
                --bot-message-color: #F9FAFB;
            }

            .chat-header,
            .input-area {
                background-color: rgba(31, 41, 55, 0.8);
                border-color: rgba(255, 255, 255, 0.1);
            }

            .input-container {
                background-color: rgba(55, 65, 81, 0.8);
            }

            .input-container:focus-within {
                background-color: rgba(55, 65, 81, 1);
            }


        }

            {
            % comment %
        }

        testing {
            % endcomment %
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: #202123;
            color: white;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: transform 0.3s ease;
            position: fixed;
            z-index: 1000;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            transition: margin-left 0.3s ease;
            height: 100vh;
            overflow-y: auto;
        }

        .new-chat-btn {
            border: 1px solid hsla(0, 0%, 100%, .2);
            border-radius: 0.375rem;
            padding: 0.75rem;
            margin: 0.5rem;
            text-align: left;
            background-color: transparent;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .new-chat-btn:hover {
            background-color: #2b2c2f;
        }

        .history-items {
            flex: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .history-item {
            padding: 0.75rem;
            margin: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: #2b2c2f;
        }

        .history-item.active {
            background-color: #343541;
        }

        .sidebar-footer {
            padding: 0.75rem;
            border-top: 1px solid hsla(0, 0%, 100%, .2);
        }

        .toggle-sidebar {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 1001;
            background: #343541;
            border: none;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
            }

            .sidebar-expanded {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Modify your existing container style */
        .container {
            max-width: 100%;
            width: 100%;
            margin: 0;
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .history-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .history-item.active {
            background-color: #f5f3ff;
            border-left: 3px solid #6366f1;
        }
        
        .dark .history-item.active {
            background-color: #3730a3;
            border-left-color: #818cf8;
        }
        
        .empty-history {
            padding: 1.5rem;
            text-align: center;
            color: #6b7280;
        }
        
        .empty-history i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <button class="new-chat-btn" id="newChatBtn">
                <i class="fas fa-plus"></i> New chat
            </button>

            <div class="history-items" id="historyItems">
                <!-- History items will be loaded here via JavaScript -->
                {% include 'langflow_integration/chat_history_items.html' %}
            </div>

            <div class="sidebar-footer">
                {% if user.is_authenticated %}
                <div class="user-info">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <div
                            style="width: 32px; height: 32px; border-radius: 50%; background-color: #4B5563; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-user text-white"></i>
                        </div>
                        <span>{{ user.username }}</span>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <button class="toggle-sidebar" id="toggleSidebar">
                <i class="fas fa-bars"></i>
            </button>

            <div class="container">
                <div class="header">
                    <div class="logo">
                        <div class="logo-icon">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="logo-text">
                            <h1>EduAssist AI</h1>
                        </div>
                    </div>
                    <p>Ask me and I'll do my best to help</p>
                </div>

                <div id="errorMessage"></div>

                <div class="chat-container">
                    <div class="chat-header">
                        <div class="assistant-info">
                            <div class="assistant-avatar">
                                <i class="fas fa-robot"></i>
                            </div>
                            <div class="assistant-status">
                                <div class="assistant-name">EduAssist AI</div>
                                <div class="assistant-availability">Online</div>
                            </div>
                        </div>
                    </div>

                    <div id="chatbox">
                        <!-- Bot welcome message -->
                        <div class="message-container bot-message">
                            <div class="message-avatar">
                                <i class="fas fa-robot"></i>
                            </div>
                            <div class="message-content">
                                <div class="message-bubble">
                                    Hello! How can I assist you today?
                                </div>
                                <div class="message-time">Just now</div>
                            </div>
                        </div>

                        <div class="typing-indicator" id="typingIndicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>

                    <div class="input-area">
                        <div class="input-container">
                            <button class="input-button" title="Attach files">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <input type="text" id="userInput" placeholder="Type your message here..."
                                autocomplete="off">
                            <button class="input-button" title="Voice input">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>
                        <button id="sendButton" title="Send message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="footer">
                &copy; 2025 EduAssist AI Assistant
            </div>
        </div>
    </div>
</body>

</html>

<script>
    // Get DOM elements
    const chatbox = document.getElementById('chatbox');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');
    const errorMessage = document.getElementById('errorMessage');

    // Function to get current time in HH:MM format
    function getCurrentTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' +
            now.getMinutes().toString().padStart(2, '0');
    }


    // Function to convert markdown to HTML
    function convertMarkdownToHTML(text) {
        // Convert bold markdown (**text**) to <strong> tags
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        // Convert line breaks to <br> tags
        text = text.replace(/\n/g, '<br>');

        return text;
    }

    // Function to add a message to the chatbox
    function addMessage(message, isUser) {
        // Create message container
        const messageContainer = document.createElement('div');
        messageContainer.classList.add('message-container');
        messageContainer.classList.add(isUser ? 'user-message' : 'bot-message');

        // Create avatar
        const avatar = document.createElement('div');
        avatar.classList.add('message-avatar');
        if (isUser) {
            avatar.classList.add('user-avatar');
            avatar.innerHTML = '<i class="fas fa-user"></i>';
        } else {
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
        }

        // Create message content container
        const messageContent = document.createElement('div');
        messageContent.classList.add('message-content');

        // Create message bubble
        const messageBubble = document.createElement('div');
        messageBubble.classList.add('message-bubble');

        // Use innerHTML with markdown conversion instead of textContent
        messageBubble.innerHTML = isUser ? message : convertMarkdownToHTML(message);

        // Create timestamp
        const timeSpan = document.createElement('div');
        timeSpan.classList.add('message-time');
        timeSpan.textContent = getCurrentTime();

        // Assemble the message
        messageContent.appendChild(messageBubble);
        messageContent.appendChild(timeSpan);
        function renameChat(sessionId, event) {
            event.stopPropagation();
            const item = event.target.closest('.history-item');
            const currentText = item.querySelector('h4').textContent.trim();
            
            const newName = prompt('Rename this chat:', currentText);
            if (newName && newName !== currentText) {
                // Call your backend rename endpoint
                fetch(`/langflow/rename-chat/${sessionId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({ new_name: newName })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        item.querySelector('h4').textContent = newName;
                        showToast('Chat renamed successfully');
                    }
                });
            }
        }
        
        function deleteChat(sessionId, event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this chat?')) {
                const item = event.target.closest('.history-item');
                
                // Add deleting animation
                item.style.opacity = '0';
                item.style.transform = 'translateX(100px)';
                item.style.transition = 'all 0.3s ease';
                
                setTimeout(() => {
                    fetch(`/langflow/delete-chat/${sessionId}/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCsrfToken(),
                        }
                    })
                    .then(() => {
                        item.remove();
                        showToast('Chat deleted successfully');
                    });
                }, 300);
            }
        }
        
        function createNewChat() {
            fetch('/langflow/new-chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.reload(); // Or better: dynamically add the new chat
                }
            });
        }
        
        // Helper function to show toast notifications
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg text-sm animate-fadeInUp';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;
    
        setLoadingState(true);
        userInput.disabled = true;
    
        addMessage(message, true);
        userInput.value = '';
    
        showTypingIndicator();
    
        try {
            let botResponse = await sendMessageToAPI(message);
            botResponse = await simulateTypingDelay(botResponse);
            hideTypingIndicator();
            addMessage(botResponse, false);
            
            // Refresh chat history after successful message
            refreshChatHistory();
        } catch (error) {
            hideTypingIndicator();
            console.error('Error:', error);
            
            // Show user-friendly error message
            const errorMsg = error.message.includes('Unexpected response') 
                ? 'The server returned an unexpected response. Please try again.'
                : error.message;
                
            addMessage(`Error: ${errorMsg}`, false);
            showError(errorMsg);
        } finally {
            setLoadingState(false);
            userInput.disabled = false;
            userInput.focus();
        }
    }

    // Function to handle API call to Django backend
    async function sendMessageToAPI(message) {
        try {
            const response = await fetch('/langflow/query/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                },
                body: JSON.stringify({ message: message }),
            });
    
            // First check if response is JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                const text = await response.text();
                throw new Error(`Unexpected response: ${text.substring(0, 100)}`);
            }
    
            const data = await response.json();
    
            if (!response.ok) {
                throw new Error(data.error || 'API request failed');
            }
    
            // Handle successful response
            if (data.response) {
                return data.response;
            } else if (data.outputs) {
                // Parse the nested Langflow response structure
                return parseLangflowResponse(data);
            } else {
                return 'I received your message, but the response format was unexpected.';
            }
        } catch (error) {
            console.error('API Error:', error);
            throw error; // Re-throw to be handled by the calling function
        }
    }
    
    function parseLangflowResponse(data) {
        try {
            // Try different response formats
            return (
                data?.outputs?.[0]?.outputs?.[0]?.results?.message?.text ||
                data?.outputs?.[0]?.outputs?.[0]?.outputs?.message?.message ||
                data?.outputs?.[0]?.outputs?.[0]?.messages?.[0]?.message ||
                JSON.stringify(data) // Fallback
            );
        } catch (e) {
            return "I couldn't parse the response properly.";
        }
    }
    // Function to get CSRF token from cookies
    function getCsrfToken() {
        const name = 'csrftoken';
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Simulate response delay for demo purposes (remove in production)
    function simulateTypingDelay(text) {
        // Estimate typing time based on message length (between 1-4 seconds)
        const baseDelay = 1000;
        const wordsPerMinute = 300; // Typing speed
        const words = text.split(' ').length;
        const typingTime = Math.min(4000, Math.max(1000, (words / wordsPerMinute) * 60 * 1000));

        return new Promise(resolve => {
            setTimeout(() => {
                resolve(text);
            }, typingTime);
        });
    }

    // Function to send the user's message
    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Disable input while processing
        userInput.disabled = true;
        sendButton.disabled = true;

        // Add the user's message to the chatbox
        addMessage(message, true);
        userInput.value = '';  // Clear the input field

        // Show typing indicator
        showTypingIndicator();

        // Send message to API
        try {
            let botResponse = await sendMessageToAPI(message);

            // Simulate typing delay (remove in production)
            botResponse = await simulateTypingDelay(botResponse);

            hideTypingIndicator();
            addMessage(botResponse, false);
        } catch (error) {
            hideTypingIndicator();
            addMessage('Sorry, something went wrong. Please try again.', false);
        }

        // Re-enable input
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
    }

        // Function to load a specific chat session
        async function loadChatSession(sessionId) {

                const data = await response.json();
                
                // Clear current chat and load the history
                const chatbox = document.getElementById('chatbox');
                chatbox.innerHTML = '';
                
                data.messages.forEach(message => {
                    addMessage(message.text, message.is_bot);
                });
                
                // Add the typing indicator back
                chatbox.innerHTML += `

        // Function to refresh chat history
        async function refreshChatHistory() {
            try {
                const response = await fetch('/langflow/chat-history/');
                
                // First check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Unexpected response: ${text.substring(0, 100)}`);
                }
        
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Update the history container
                document.getElementById('historyItems').innerHTML = data.html;
                
                // Reattach event listeners to new items
                document.querySelectorAll('.history-item').forEach(item => {
                    item.addEventListener('click', function() {
                        loadChatSession(this.dataset.sessionId);
                    });
                });
            } catch (error) {
                console.error('Error loading chat history:', error);
                showError('Failed to load chat history');
            }
        }
        
        // Call refreshChatHistory when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            refreshChatHistory();
            
            // Load the most recent chat if available
            const firstChatItem = document.querySelector('.history-item');
            if (firstChatItem) {
                firstChatItem.classList.add('active');
                loadChatSession(firstChatItem.dataset.sessionId);
            }
        });

                refreshChatHistory();

                addMessage('Sorry, something went wrong. Please try again.', false);
            }

            setLoadingState(false);

            userInput.focus();
