{% for session in chat_sessions %}
<div class="history-item group relative bg-white dark:bg-gray-800 rounded-lg p-3 mb-2 cursor-pointer transition-all duration-200 hover:shadow-md hover:bg-gray-50 dark:hover:bg-gray-700 border border-gray-100 dark:border-gray-700"
     data-session-id="{{ session.id }}">
    <div class="flex items-center gap-3">
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center">
            <i class="fas fa-comment text-indigo-500 dark:text-indigo-300 text-sm"></i>
        </div>
        <div class="min-w-0 flex-1">
            <h4 class="text-sm font-medium text-gray-800 dark:text-gray-100 truncate">
                {% if session.messages.first %}
                    {{ session.messages.first.message|truncatechars:24 }}
                {% else %}
                    New Chat
                {% endif %}
            </h4>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                <i class="far fa-clock mr-1"></i>
                {{ session.created_at|date:"M d, g:i A" }}
            </p>
        </div>
    </div>
    
    <!-- Action buttons (shown on hover) -->
    <div class="absolute right-3 top-3 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex gap-1">
        <button class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-indigo-500 dark:hover:text-indigo-300 rounded-full hover:bg-indigo-50 dark:hover:bg-indigo-900/50 transition-all"
                title="Rename" onclick="renameChat({{ session.id }}, event)">
            <i class="fas fa-pencil-alt text-xs"></i>
        </button>
        <button class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-500 rounded-full hover:bg-red-50 dark:hover:bg-red-900/10 transition-all"
                title="Delete" onclick="deleteChat({{ session.id }}, event)">
            <i class="fas fa-trash-alt text-xs"></i>
        </button>
    </div>
</div>
{% empty %}
<div class="text-center py-6 px-4 rounded-lg border-2 border-dashed border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50">
    <div class="mx-auto w-12 h-12 mb-3 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
        <i class="fas fa-comments text-gray-400 dark:text-gray-500 text-xl"></i>
    </div>
    <h4 class="text-gray-500 dark:text-gray-400 font-medium">No conversations yet</h4>
    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Start chatting to see your history here</p>
    <button onclick="createNewChat()" class="mt-3 text-xs bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-md transition-colors inline-flex items-center gap-1">
        <i class="fas fa-plus"></i> New Chat
    </button>
</div>

<style>
    .history-item {
        position: relative;
        transition: all 0.2s ease;
        overflow: hidden;
    }
    
    .history-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    
    .history-item.active {
        background-color: #f5f3ff;
        border-color: #c7d2fe;
    }
    
    .dark .history-item.active {
        background-color: #3730a3;
        border-color: #4f46e5;
    }
    
    /* Animation for new items */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(5px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .history-item {
        animation: fadeInUp 0.3s ease forwards;
    }
    
    /* Delay animation for each item */
    .history-item:nth-child(1) { animation-delay: 0.1s; }
    .history-item:nth-child(2) { animation-delay: 0.2s; }
    .history-item:nth-child(3) { animation-delay: 0.3s; }

    /* Add these animations to your stylesheet */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeOutDown {
    from {
        opacity: 1;
        transform: translateY(0);
    }
    to {
        opacity: 0;
        transform: translateY(10px);
    }
}

.animate-fadeInUp {
    animation: fadeInUp 0.3s ease forwards;
}

.animate-fadeOutDown {
    animation: fadeOutDown 0.3s ease forwards;
}
</style>

<script>
    // Add these functions to your script
function renameChat(sessionId, event) {
    event.stopPropagation();
    const item = event.target.closest('.history-item');
    const currentText = item.querySelector('h4').textContent.trim();
    
    const newName = prompt('Rename this chat:', currentText);
    if (newName && newName !== currentText) {
        // Call your backend rename endpoint
        fetch(`/langflow/rename-chat/${sessionId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
            },
            body: JSON.stringify({ new_name: newName })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                item.querySelector('h4').textContent = newName;
                showToast('Chat renamed successfully');
            }
        });
    }
}

function deleteChat(sessionId, event) {
    event.stopPropagation();
    if (confirm('Are you sure you want to delete this chat?')) {
        const item = event.target.closest('.history-item');
        
        // Add deleting animation
        item.style.opacity = '0';
        item.style.transform = 'translateX(100px)';
        item.style.transition = 'all 0.3s ease';
        
        setTimeout(() => {
            fetch(`/langflow/delete-chat/${sessionId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                }
            })
            .then(() => {
                item.remove();
                showToast('Chat deleted successfully');
            });
        }, 300);
    }
}

function createNewChat() {
    fetch('/langflow/new-chat/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.reload(); // Or better: dynamically add the new chat
        }
    });
}

// Helper function to show toast notifications
function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg text-sm animate-fadeInUp';
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.classList.add('animate-fadeOutDown');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
</script>
{% endfor %}
