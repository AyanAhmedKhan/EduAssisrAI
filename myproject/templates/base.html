<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Form Validation{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366F1;
            --error-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --text-color: #333;
            --border-color: #ced4da;
            --orange-btn: #ee9b00;
            --light-bg: rgb(246, 255, 255);
            --form-bg: rgb(253, 253, 253);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--light-bg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .form-container {
            background-color: var(--primary-color);
            box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .form-header {
            text-align: center;
            padding: 30px 0;
        }

        .form-header h1 {
            color: var(--text-color);
            font-weight: 600;
            margin: 0;
        }

        .form-body {
            padding: 0 40px 30px;
        }

        .form-control {
            margin-bottom: 15px;
            position: relative;
        }

        .form-control label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-control input {
            width: 100%;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .form-control input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
        }

        .form-control .validation-icon {
            position: absolute;
            right: 15px;
            top: 38px;
            font-size: 16px;
            visibility: hidden;
        }

        .form-control small {
            color: var(--error-color);
            font-size: 13px;
            visibility: hidden;
            display: block;
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: var(--orange-btn);
            color: white;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e08b00;
            transform: translateY(-2px);
        }

        /* Validation states */
        .form-control.success input {
            border-color: var(--success-color);
        }

        .form-control.error input {
            border-color: var(--error-color);
        }

        .form-control.success .fa-check {
            visibility: visible;
        }

        .form-control.error .fa-close {
            visibility: visible;
        }

        .form-control.error small {
            visibility: visible;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 16px;
        }

        .password-rules {
            list-style: none;
            padding: 10px 0;
            font-size: 14px;
            color: var(--error-color);
            margin-top: 5px;
        }

        .password-rules li {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .password-rules li i {
            margin-right: 8px;
            font-size: 12px;
        }

        .alert {
            margin: 0 40px 20px;
        }

        @media (max-width: 480px) {
            .form-body {
                padding: 0 25px 25px;
            }
            
            .form-header {
                padding: 25px 0;
            }
            
            .alert {
                margin: 0 25px 15px;
            }
        }
    </style>
</head>
<body>
    {% block start %}
    <!-- Content will be inserted here from child templates -->
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
